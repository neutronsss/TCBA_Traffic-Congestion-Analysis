name: TCBA Lakehouse & API CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-validation:
    name: CI - Lint Python & Validate JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linter & test tools
        run: |
          pip install flake8 pytest

      - name: Check Python syntax & style (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate ADF & Synapse JSON files
        run: |
          python -c "
          import glob, json
          for f in glob.glob('**/*.json', recursive=True):
              with open(f, encoding='utf-8') as fp:
                  json.load(fp)
          print('Semua file JSON valid!')
          "

      # jika Adel udah bikin folder tests/
      # - name: Run unit tests (Pytest)
      #   run: pytest

  cd-sync-azure:
    name: CD - Sync Scripts to ADLS Gen2
    needs: ci-validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload skrip ke ADLS Gen2
        run: |
          az storage blob upload-batch \
            --account-name adls1tcba \
            --auth-mode login \
            --destination lakehouse \
            --destination-path scripts/ \
            --source ./notebook \
            --overwrite
